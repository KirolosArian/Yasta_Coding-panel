<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security & Audit Logs — Yasta_Coding Panel</title>
  <link rel="stylesheet" href="css/yasta-glass.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">Y</div>
        <div class="brand-title">YASTA_<span>CODING</span></div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="keys.html" class="nav-item" data-page="keys">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-1-1l-3 3m1 1l-2 2m-1-1l-2 2m-1-1l-3 3a5 5 0 0 1-7-7l9-9a5 5 0 0 1 7 7z"/></svg>
          <span>License Keys</span>
        </a>
        <a href="manage-user.html" class="nav-item" data-page="manage-user" id="nav-users-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Manage Users</span>
        </a>
        <a href="logs.html" class="nav-item active" data-page="logs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Audit Logs</span>
        </a>
        <a href="settings.html" class="nav-item" data-page="settings" id="nav-settings-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-box">
          <div class="user-info">
            <span class="user-info-name" id="user-profile-name">Operator</span>
            <span class="user-info-role" id="user-profile-role">Administrator</span>
          </div>
          <button class="btn btn-secondary btn-sm btn-icon" title="Logout" onclick="YastaApp.logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-toggle" id="mobile-sidebar-toggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="header-title">Security & Audit Trail</div>
        </div>

        <div class="header-right">
          <button class="btn btn-secondary btn-sm" id="refresh-logs-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span>Refresh</span>
          </button>
        </div>
      </header>

      <div class="content-body">
        <!-- Filter Toolbar -->
        <div class="glass-panel" style="padding: 18px 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
          <div style="display: flex; gap: 12px; flex: 1; min-width: 280px; max-width: 450px;">
            <input type="text" id="log-search-input" class="form-control" placeholder="Search by IP, actor, or detail...">
          </div>

          <div style="display: flex; gap: 12px; align-items: center;">
            <select id="log-action-filter" class="form-control" style="width: 200px;">
              <option value="all">All Actions</option>
              <option value="LOGIN">Auth & Logins</option>
              <option value="KEY_">Key Operations</option>
              <option value="VALIDATE">Client Validations</option>
              <option value="USER_">User Operations</option>
              <option value="SETTINGS_">System Settings</option>
            </select>
          </div>
        </div>

        <!-- Logs Data Table -->
        <div class="glass-panel" style="padding: 0; overflow: hidden;">
          <div class="table-responsive">
            <table class="yasta-table">
              <thead>
                <tr>
                  <th>Action Type</th>
                  <th>Actor</th>
                  <th>IP Address</th>
                  <th>Target ID</th>
                  <th>Timestamp</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="logs-table-body">
                <tr>
                  <td colspan="6" style="text-align: center; color: var(--text-dim); padding: 36px;">
                    Streaming audit logs...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>
