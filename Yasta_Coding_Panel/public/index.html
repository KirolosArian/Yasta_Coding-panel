<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yasta_Coding Panel — Authentication Gateway</title>
  <link rel="stylesheet" href="css/yasta-glass.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="auth-box glass-panel">
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="auth-title">YASTA_CODING</h1>
      <p class="text-muted" style="font-size: 0.9rem;">Cyber Licensing & Device Verification Command Center</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Operator ID / Username</label>
        <div style="position: relative;">
          <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Security Key / Password</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted);">
          <input type="checkbox" id="remember-me" style="accent-color: var(--accent-cyan); width: 16px; height: 16px;">
          <span>Remember session</span>
        </label>
        <span class="text-cyan" style="font-size: 0.8rem;">Protected via HMAC</span>
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
        </svg>
        <span>Authorize Access</span>
      </button>
    </form>

    <div style="margin-top: 28px; padding-top: 18px; border-top: var(--border-glass); font-size: 0.78rem; color: var(--text-dim);">
      &copy; 2026 Yasta_Coding Panel. All Rights Reserved. Fully Isolated Namespace.
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, route to dashboard
      const token = YastaApp.getToken();
      if (token) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const loginBtn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          YastaApp.showToast('Please enter both username and password.', 'error');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = `<span>Authenticating...</span>`;

        try {
          const res = await YastaApp.apiFetch('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username, password })
          });

          if (res.token && res.user) {
            YastaApp.setAuth(res.token, res.user);
            YastaApp.showToast('Authorization successful! Redirecting...', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 600);
          } else {
            throw new Error(res.error || 'Invalid credentials or user banned.');
          }
        } catch (err) {
          YastaApp.showToast(err.message, 'error');
          loginBtn.disabled = false;
          loginBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
            </svg>
            <span>Authorize Access</span>
          `;
        }
      });
    });
  </script>
</body>
</html>
